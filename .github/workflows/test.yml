name: "Test Suite"
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu
          - macos
          - windows
        toolchain:
          - stable
          - 1.79
    name: cargo test on ${{ matrix.os }}, rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Cargo check
        run: cargo check
      - name: Cargo check (all features)
        run: cargo check --workspace --all-targets --all-features --exclude test-no-std
      - name: Cargo test
        run: cargo test --workspace --all-targets
      - name: Cargo test (all features)
        run: cargo test --workspace --all-targets --all-features --exclude test-no-std
      - name: Verify no_std support
        run: cargo check -p test-no-std
